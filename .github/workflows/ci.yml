name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  security-events: write

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node-version }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: CI — typecheck + lint + format + audit + test + build
        run: pnpm ci

  security:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy.sarif'
          severity: 'CRITICAL,HIGH'
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy.sarif'
      - uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json

  package:
    runs-on: ubuntu-latest
    needs: [ci, security]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: pnpm package:chrome && pnpm package:firefox && pnpm package:edge
      - uses: actions/upload-artifact@v4
        with:
          name: prettify-plus-chrome
          path: 'dist-chrome/*.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: prettify-plus-firefox
          path: 'dist-firefox/*.xpi'
      - uses: actions/upload-artifact@v4
        with:
          name: prettify-plus-edge
          path: 'dist-edge/*.zip'

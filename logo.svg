<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient: deep navy to dark purple -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1145"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <!-- Prism face gradients -->
    <linearGradient id="prismLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="prismRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="prismTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>

    <!-- Rainbow refracted beams -->
    <linearGradient id="beam1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <!-- Incoming white light beam -->
    <linearGradient id="whiteBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="70%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft glow for prism -->
    <filter id="prismGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Bracket glow -->
    <filter id="bracketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#67E8F9" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in" result="glowColor"/>
      <feMerge>
        <feMergeNode in="glowColor"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle grid pattern for techy feel -->
  <g opacity="0.04" stroke="white" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Incoming white light beam (left side → prism) -->
  <polygon points="40,232 40,280 220,262 220,250" fill="url(#whiteBeam)" opacity="0.8"/>

  <!-- Refracted color beams (right side of prism → spreading out) -->
  <g filter="url(#glow)">
    <!-- Red beam -->
    <polygon points="310,218 472,148 472,158 310,226" fill="url(#beam1)"/>
    <!-- Orange/Yellow beam -->
    <polygon points="310,234 472,210 472,220 310,242" fill="url(#beam2)"/>
    <!-- Green beam -->
    <polygon points="310,250 472,252 472,262 310,258" fill="url(#beam3)"/>
    <!-- Blue beam -->
    <polygon points="310,266 472,300 472,310 310,274" fill="url(#beam4)"/>
    <!-- Purple beam -->
    <polygon points="310,282 472,358 472,368 310,290" fill="url(#beam5)"/>
  </g>

  <!-- Small sparkle dots on beams -->
  <circle cx="400" cy="155" r="3" fill="#F43F5E" opacity="0.7"/>
  <circle cx="430" cy="215" r="2.5" fill="#F59E0B" opacity="0.7"/>
  <circle cx="450" cy="258" r="3" fill="#10B981" opacity="0.7"/>
  <circle cx="420" cy="308" r="2.5" fill="#3B82F6" opacity="0.7"/>
  <circle cx="445" cy="365" r="3" fill="#A855F7" opacity="0.7"/>

  <!-- Prism (3D triangular prism) -->
  <g filter="url(#prismGlow)">
    <!-- Left face -->
    <polygon points="220,176 220,336 264,356 264,156" fill="url(#prismLeft)" opacity="0.85"/>
    <!-- Right face -->
    <polygon points="264,156 264,356 310,336 310,176" fill="url(#prismRight)" opacity="0.85"/>
    <!-- Top face -->
    <polygon points="220,176 264,156 310,176 264,196" fill="url(#prismTop)" opacity="0.7"/>
    <!-- Edge highlights -->
    <line x1="220" y1="176" x2="264" y2="156" stroke="white" stroke-width="1.5" opacity="0.5"/>
    <line x1="264" y1="156" x2="310" y2="176" stroke="white" stroke-width="1.5" opacity="0.3"/>
    <line x1="264" y1="156" x2="264" y2="356" stroke="white" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Left bracket { -->
  <g filter="url(#bracketGlow)">
    <path d="M120,190 C120,190 100,190 100,210 L100,240 C100,256 82,256 82,256 C82,256 100,256 100,272 L100,302 C100,322 120,322 120,322"
          fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Right bracket } -->
  <g filter="url(#bracketGlow)">
    <path d="M392,190 C392,190 412,190 412,210 L412,240 C412,256 430,256 430,256 C430,256 412,256 412,272 L412,302 C412,322 392,322 392,322"
          fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  </g>

  <!-- Small floating data dots (representing structured data) -->
  <g opacity="0.3">
    <circle cx="140" cy="380" r="4" fill="#06B6D4"/>
    <circle cx="158" cy="395" r="3" fill="#8B5CF6"/>
    <circle cx="148" cy="410" r="3.5" fill="#67E8F9"/>
    <circle cx="370" cy="120" r="3" fill="#F59E0B"/>
    <circle cx="385" cy="108" r="4" fill="#10B981"/>
    <circle cx="355" cy="110" r="2.5" fill="#F43F5E"/>
  </g>

  <!-- Bottom label area — "PP" monogram subtly -->
  <g opacity="0.12">
    <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="white" letter-spacing="8">PRETTIFY+</text>
  </g>
</svg>
